version: '3.8'

services:
  # ============================================================================
  # Qdrant Vector Database
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: bootcamp-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - bootcamp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Neo4j Graph Database
  # ============================================================================
  neo4j:
    image: neo4j:5.15-community
    container_name: bootcamp-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/bootcamp123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=512m
    networks:
      - bootcamp-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "bootcamp123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Prefect Server (Workflow Orchestration)
  # ============================================================================
  prefect-server:
    image: prefecthq/prefect:2.14-python3.11
    container_name: bootcamp-prefect
    ports:
      - "4200:4200"  # Prefect UI
    volumes:
      - prefect_data:/root/.prefect
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_API_URL=http://0.0.0.0:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_UI_API_URL=http://localhost:4200/api
    networks:
      - bootcamp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # PostgreSQL (for Prefect backend) - Optional but recommended
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bootcamp-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    networks:
      - bootcamp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
# Volumes
# ============================================================================
volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  prefect_data:
    driver: local
  postgres_data:
    driver: local

# ============================================================================
# Network
# ============================================================================
networks:
  bootcamp-network:
    driver: bridge
