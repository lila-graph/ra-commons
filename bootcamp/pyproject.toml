[project]
name = "ai-engineering-bootcamp"
version = "0.1.0"
description = "Production-ready AI Engineering Bootcamp: LangGraph, RAG, and Agentic Workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core LLM frameworks
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langgraph>=0.0.20",
    "langsmith>=0.0.70",

    # Vector databases and search
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",

    # Graph databases
    "neo4j>=5.15.0",
    "graphiti-core>=0.3.0",

    # Embeddings and models
    "openai>=1.10.0",
    "anthropic>=0.8.0",
    "sentence-transformers>=2.2.0",
    "tiktoken>=0.5.0",

    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Pipeline orchestration
    "prefect>=2.14.0",
    "prefect-dask>=0.2.0",

    # Evaluation and testing
    "ragas>=0.1.0",
    "datasets>=2.16.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",

    # Observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "loguru>=0.7.0",

    # Document processing
    "unstructured>=0.11.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "httpx>=0.25.0",

    # Jupyter for notebooks
    "jupyter>=1.0.0",
    "ipykernel>=6.28.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
